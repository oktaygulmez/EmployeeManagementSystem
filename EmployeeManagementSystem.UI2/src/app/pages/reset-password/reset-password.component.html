
<div class="background-container" style="background-color: #f3f3f4; width: 100%; height: 1000px;">
  <div class="middle-box text-center loginscreen animated fadeInDown">
    <div class="mt-5 pt-5">



      <form class="m-t" role="form" *ngIf="!resetMode" (ngSubmit)="passwordResetMail()">

        <h3 class="mt-3 mb-4">E Mail Adresinizi Giriniz</h3>

        <div class="example-container">

          <mat-form-field appearance="outline">
            <mat-label>EMail Adresi</mat-label>
            <input matInput placeholder="EMail Adresi" type="email" id="email" [(ngModel)]="email" name="email">
            <mat-icon matSuffix>mail</mat-icon>
          </mat-form-field>

          <button type="submit" class="btn btn-e4 block full-width m-b mt-2" style="height:40px;">Şifre Sıfırlama Maili Gönder</button>

        </div>
      </form>


      <form class="m-t" role="form" *ngIf="resetMode" (ngSubmit)="resetPassword()">

        <h3 class="mt-3 mb-4">Yeni Şifrenizi Belirleyin</h3>

        <div class="example-container">

          <mat-form-field appearance="outline">
            <mat-label>Şifre</mat-label>
            <input matInput [type]="hide ? 'password' : 'text'" id="password" placeholder="Şifre" [(ngModel)]="password" name="password">
            <button type="button" mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
              <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
          </mat-form-field>


          <mat-form-field appearance="outline">
            <mat-label>Şifre</mat-label>
            <input matInput [type]="hide ? 'password' : 'text'" id="passwordRepait" placeholder="Şifre" [(ngModel)]="passwordRepait" name="passwordRepait">
            <button type="button" mat-icon-button matSuffix (click)="hide2 = !hide2" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide2">
              <mat-icon>{{hide2 ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
          </mat-form-field>

          <button type="submit" class="btn btn-e4 block full-width m-b mt-2" style="height:40px;">Yeni Şifremi Oluştur</button>

        </div>
      </form>


    </div>
    </div>
</div>
