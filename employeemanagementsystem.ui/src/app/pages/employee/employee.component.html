<div class="wrapper wrapper-content animated fadeInRight pl-0 pr-0 pt-3">
    <div class="ibox">
      <div class="ibox-title d-flex align-items-center pt-2">
        <h5 class="mt-2">Çalışanlar</h5>
  
        <div class="ibox-tools pr-2">
          <a class="collapse-link">
            <i class="fa fa-chevron-up font-bold"></i>
          </a>
        </div>
  
        <div class="col-lg-2">
          <button
            type="button"
            class="btn btn-e4 btn-rounded ml-2"
            (click)="openAddDialog()"
          >
            <i class="fa fa-user-plus mr-1"></i>Yeni Çalışan Ekle
          </button>
        </div>
  
        <div class="col-lg-5">
          <div class="input-group pl-5 pr-5">
            <div class="input-group-prepend">
              <span class="input-group-text" style="font-size: 14px">
                <i class="material-icons" style="font-size: 16px">search</i>
              </span>
            </div>
  
            <input
              class="form-control"
              placeholder="Çalışan Ara"
              [(ngModel)]="searchText"
              (input)="applyFilter()"
              style="font-size: 14px"
            />
          </div>
        </div>
        <div class="col-lg-1">
          <h5 class="mt-1">Departmanlar</h5>
        </div>
        <div class="col-lg-3">
          <section class="col-12 col-lg-12">
            <select
              id="departmentSelect"
              class="form-control w-100"
              [(ngModel)]="selectedDepartment"
              (change)="applyFilter()"
            >
              <option value="">Tümü</option>
              <option *ngFor="let dept of departments" [value]="dept.id">
                {{ dept.departmentName }}
              </option>
            </select>
          </section>
        </div>
      </div>
  
      <div class="ibox-content">
        <div class="col-lg-12 pr-0 pl-0">
          <table mat-table [dataSource]="dataSource" matSort>
            <ng-container matColumnDef="name" sticky> 
              <th mat-header-cell mat-sort-header *matHeaderCellDef>Ad</th>
              <td mat-cell *matCellDef="let element">{{ element.name }}</td>
            </ng-container>
  
            <ng-container matColumnDef="surName">
              <th mat-header-cell mat-sort-header *matHeaderCellDef>Soyad</th>
              <td mat-cell *matCellDef="let element">{{ element.surName }}</td>
            </ng-container>
  
            <ng-container matColumnDef="eMail">
              <th mat-header-cell *matHeaderCellDef>E-Mail</th>
              <td mat-cell *matCellDef="let element">{{ element.eMail }}</td>
            </ng-container>
  
            <ng-container matColumnDef="phone">
              <th mat-header-cell *matHeaderCellDef>Telefon Numarası</th>
              <td mat-cell *matCellDef="let element">{{ element.phone }}</td>
            </ng-container>
  
            <ng-container matColumnDef="adress">
              <th mat-header-cell mat-sort-header *matHeaderCellDef>Adres</th>
              <td mat-cell *matCellDef="let element">{{ element.adress }}</td>
            </ng-container>
  
            <ng-container matColumnDef="departmentName">
              <th mat-header-cell mat-sort-header *matHeaderCellDef>Departman Adı</th>
              <td mat-cell *matCellDef="let element">
                {{ element.departmentName }}
              </td>
            </ng-container>
  
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef class="text-center">
                İşlemler
              </th>
              <td mat-cell *matCellDef="let element" style="width: 250px">
                <button
                  type="button"
                  class="btn btn-warning btn-rounded ml-2"
                  (click)="openEditDialog(element)"
                >
                  <i class="fa fa-edit mr-1"></i>Güncelle
                </button>
                <button
                  type="button"
                  class="btn btn-danger btn-rounded ml-2"
                  (click)="deleteEmployee(element.id)"
                >
                  <i class="fa fa-trash mr-1"></i>Sil
                </button>
              </td>
            </ng-container>
  
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          </table>
  
          <mat-paginator
            [pageSizeOptions]="[10, 25, 100]"
            showFirstLastButtons
          ></mat-paginator>
        </div>
      </div>
    </div>
  </div>
